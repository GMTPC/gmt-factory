services:
  app:
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - vite_assets:/var/www/html/public/build:ro

  vite:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "/app/docker/dev-vite.sh"]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - vite_node_modules:/app/node_modules
      - vite_assets:/app/public/build
    environment:
      VITE_HMR_HOST: localhost
      VITE_DEV_SERVER: "true"
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - default
    restart: unless-stopped

volumes:
  vendor:
  vite_node_modules:
  vite_assets:
