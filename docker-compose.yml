services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    environment:
      # ใช้ key เดียวกับ .env บนเครื่อง เพื่อไม่ให้ session/cookie หลุดทุกครั้งที่ recreate container
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      APP_URL: http://localhost:8088
      DB_CONNECTION: "${DB_CONNECTION:-sqlsrv}"
      DB_HOST: "${DB_HOST:?DB_HOST must be set in .env}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE must be set in .env}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set in .env}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_CONNECTION_BPLUS: sqlsrv
      DB_HOST_BPLUS: mssql-249
      DB_PORT_BPLUS: "1433"
      DB_DATABASE_BPLUS: GypmantechNew3
      DB_USERNAME_BPLUS: sa
      DB_PASSWORD_BPLUS: "${DB_PASSWORD_BPLUS}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    networks:
      - default
      - mssql-local
    restart: unless-stopped

networks:
  mssql-local:
    external: true
    name: mssql-local_default
